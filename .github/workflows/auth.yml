name: deploy-auth

on:
  push:
    branches:
      - main
    paths:
      - 'auth/**'
      - '.github/workflows/auth.yml'

defaults:
  run:
    working-directory: ./auth

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Build the auth app
              run: npm run build

            - name: Deploy to AWS Cli
              uses: shinyinc/action-aws-cli@v1.2
            - run: aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }}/auth/latest --delete
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} 
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                AWS_DEFAULT_REGION: "ap-south-1"
            
            - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/auth/latest/remoteEntry.js"
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} 
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                AWS_DEFAULT_REGION: "ap-south-1"